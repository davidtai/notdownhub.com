<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="notdownhub">
  <!-- solid brand-coral badge: guarantees contrast on light AND dark tab bars -->
  <rect width="64" height="64" rx="14" fill="#f2663b" />
  <!-- mark in white on the badge -->
  <g transform="translate(6.4,3.2) scale(0.8)">
    <!-- short thick strings -->
    <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round">
      <path d="M13 31 L 20 38" />
      <path d="M32 29 L 32 38" />
      <path d="M51 31 L 44 38" />
    </g>
    <!-- big cartoony balloons (dominant) -->
    <g fill="#ffffff">
      <ellipse cx="13" cy="20" rx="10" ry="11.5" />
      <ellipse cx="51" cy="20" rx="10" ry="11.5" />
      <ellipse cx="32" cy="15" rx="12" ry="13" />
    </g>
    <!-- monitor: screen shows the badge coral through the thick white bezel -->
    <g fill="#ffffff">
      <path fill-rule="evenodd" d="M18 38 h28 a3 3 0 0 1 3 3 v13 a3 3 0 0 1 -3 3 h-28 a3 3 0 0 1 -3 -3 v-13 a3 3 0 0 1 3 -3 z M23 43 h18 a1.5 1.5 0 0 1 1.5 1.5 v6 a1.5 1.5 0 0 1 -1.5 1.5 h-18 a1.5 1.5 0 0 1 -1.5 -1.5 v-6 a1.5 1.5 0 0 1 1.5 -1.5 z" />
      <rect x="29" y="57" width="6" height="3.6" />
      <rect x="23" y="60.4" width="18" height="3" rx="1.5" />
    </g>
  </g>
</svg>
